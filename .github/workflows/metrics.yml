name: Calendario de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics.yml

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Actualizar el único gráfico del perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN_KEKOTEK }}
          user: kekotek
          template: classic
          base: ""
          filename: metrics-calendar-full.svg
          config_timezone: America/Santiago
          plugin_calendar: yes
          plugin_calendar_limit: 1
