name: Calendario de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_contributions.py
      - .github/workflows/metrics.yml

concurrency:
  group: profile-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dibujar el calendario con las contribuciones reales
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_KEKOTEK }}
        run: python scripts/generate_contributions.py
      - name: Guardar el gráfico actualizado
        run: |
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution calendar [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
